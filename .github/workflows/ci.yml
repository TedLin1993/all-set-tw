name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test backend
        run: npm run test:backend

      - name: Test frontend
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Build browser deployment artifact
        run: npm run release:build -- --version ci-${{ github.sha }}

      - name: Verify browser deployment artifact
        run: npm run release:verify -- dist/releases/ci-${{ github.sha }}

      - name: Retain browser deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-${{ github.sha }}
          path: dist/releases/ci-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 7
