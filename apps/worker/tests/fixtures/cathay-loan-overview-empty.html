<!doctype html>
<html lang="zh-TW">
  <body>
    <div id="root">
      <main>
        <section>
          <h2>貸款帳戶總覽</h2>
          <div role="status">
            <p data-evt="result-title">查無資料</p>
            <p>目前無貸款資料，請選擇其他服務。</p>
          </div>
          <aside>
            <p>小額貸款超輕鬆，資金活用多更多。</p>
          </aside>
          <section aria-label="說明">
            <p>貸款帳戶總覽只包含特定貸款產品，不作為貸款證明。</p>
            <p>
              每日 22:00 至次日 03:00
              為例行維護時間，暫時無法提供「貸款總覽-基本查詢」服務。
            </p>
            <p>若貸款帳戶已結清，系統將於結清次日自動刪除資料。</p>
          </section>
        </section>
      </main>
      <footer>
        <p>公告訊息 友善個人網銀 聯絡我們 服務據點</p>
      </footer>
    </div>
  </body>
</html>
