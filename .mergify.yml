merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: main
    batch_size: 1
    update_method: rebase
    merge_method: merge
    queue_conditions:
      - base = main
      - check-success = @github-actions/validate
    merge_conditions:
      - base = main
      - check-success = @github-actions/validate
